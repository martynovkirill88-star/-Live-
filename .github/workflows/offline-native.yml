name: Native offline download regression
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile native AVFoundation probe
        run: |
          mkdir -p /tmp/OfflineProbe.app/Contents/MacOS
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string fun.chepushkavpn.offline-probe' /tmp/OfflineProbe.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string OfflineProbe' /tmp/OfflineProbe.app/Contents/Info.plist
          swiftc App/OfflineDownloadPolicy.swift Tests/NativeOffline/main.swift -o /tmp/OfflineProbe.app/Contents/MacOS/OfflineProbe -framework AVFoundation
          codesign --force --sign - /tmp/OfflineProbe.app
      - name: Download and validate actual native HLS package
        run: /tmp/OfflineProbe.app/Contents/MacOS/OfflineProbe
      - name: Compile actual app download manager
        run: |
          python3 Tests/ManagerOffline/prepare.py
          mkdir -p /tmp/OfflineManager.app/Contents/MacOS
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string fun.chepushkavpn.offline-manager-probe' /tmp/OfflineManager.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string OfflineManager' /tmp/OfflineManager.app/Contents/Info.plist
          swiftc App/OfflineDownloadPolicy.swift /tmp/ManagerOffline/Manager.swift /tmp/ManagerOffline/Models.swift Tests/ManagerOffline/main.swift -o /tmp/OfflineManager.app/Contents/MacOS/OfflineManager -framework AVFoundation
          codesign --force --sign - /tmp/OfflineManager.app
      - name: Legacy record and canceled retry through actual manager
        run: /tmp/OfflineManager.app/Contents/MacOS/OfflineManager download
      - name: Reopen completed download in fresh app process
        run: /tmp/OfflineManager.app/Contents/MacOS/OfflineManager restore
      - name: Delete download through actual manager
        run: /tmp/OfflineManager.app/Contents/MacOS/OfflineManager delete
