name: ChepushkaLive
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  SwiftADB:
    path: Vendor/SwiftADB

targets:
  ChepushkaLive:
    type: application
    platform: iOS
    sources:
      - App/LiveApp.swift
      - App/MiniGamesView.swift
      - App/CaptureComposer.swift
      - App/ClipCamera.swift
      - App/ClipsFeed.swift
      - path: App/CameraMusic
        type: folder
        buildPhase: resources
      - App/OfflineDownloads.swift
      - App/OfflineDownloadPolicy.swift
      - App/TVSetup.swift
      - App/TVADBIdentity.swift
      - path: App/TVSetupPage
        type: folder
        buildPhase: resources
      - App/Assets.xcassets
      - path: App/Player
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftADB
        product: SwiftADB
      - package: SwiftADB
        product: ADBPairing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.chepushkavpn.live
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Чепушка Live
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 4.0.3
        CURRENT_PROJECT_VERSION: 49
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Сохраняйте свои клипы в медиатеку iPhone.
        INFOPLIST_KEY_NSCameraUsageDescription: Камера нужна для записи видео перед публикацией.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Микрофон нужен для записи звука видео и голосового поиска.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Приложение распознаёт поисковый запрос на iPhone.
        SWIFT_VERSION: 5.0


        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Поиск вашего Android TV и установка RuStore и Чепушки Live с вашего разрешения.
