name: ChepushkaLive
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  ChepushkaLive:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.chepushkavpn.live
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Чепушка Live
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Камера используется для записи эфира по вашему запросу.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Микрофон используется для звука эфира.
        MARKETING_VERSION: 2.0.1
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: 5.0

