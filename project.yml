name: ChepushkaLive
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ChepushkaLive:
    type: application
    platform: iOS
    sources:
      - App/LiveApp.swift
      - path: App/Player
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.chepushkavpn.live
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Чепушка Live
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 3.3.4
        CURRENT_PROJECT_VERSION: 15
        SWIFT_VERSION: 5.0













