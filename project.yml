name: ChepushkaLive
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ChepushkaLive:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.chepushkavpn.live
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Чепушка Live
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 3.0.0
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: 5.0


